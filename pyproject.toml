[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dealwatch"
version = "0.2.0"
description = "Evidence-first Australian deal alerts for TrueNAS"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "lxml>=6,<7", "pydantic>=2.11,<3", "pydantic-settings>=2.9,<3", "tzdata>=2025.1", "gkeepapi==0.17.1", "gpsoauth==2.0.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[project.scripts]
dealwatch = "dealwatch.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
