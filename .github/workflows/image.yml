name: Test and publish image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: pip install -r requirements-test.lock && pip install --no-deps -e .
      - run: ruff check src tests && ruff format --check src tests && pytest -q
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        env:
          IMAGE: ghcr.io/smeghead3130/dealwatch
        run: |
          docker build -t "$IMAGE:$GITHUB_REF_NAME" .
          docker run --rm --entrypoint python "$IMAGE:$GITHUB_REF_NAME" -m dealwatch --help
      - name: Publish to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/smeghead3130/dealwatch
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker logout ghcr.io
